# 호스트 Nginx(/etc/nginx/sites-available/default)와
# Docker 컨테이너(/etc/nginx/conf.d/default.conf)에서 동일하게 사용하는 서버 블록.
server {
    # IPv4 전용 VPC 이므로 IPv6 listen 은 두지 않는다 (docs/troubleshooting.md #1 참고)
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 외부 접속 검증(B): GET /health → 200, 본문 "OK"
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 서버 버전 노출 최소화
    server_tokens off;
}
